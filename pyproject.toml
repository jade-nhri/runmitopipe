[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runmitopipe"
version = "0.1.0"
description = "Batch pipeline for mitochondrial genome reconstruction from Nanopore data (reference selection, iterative Medaka polishing, depth trimming)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Yu-Chieh Liao", email = "jade@nhri.org.tw"}  ]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.81",
    "pandas>=2.0",
    "pysam>=0.22",
    "requests>=2.31",
    "tqdm>=4.66",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.scripts]
runmitopipe = "mito_pipeline.pipeline:main"
download-ncbi-fasta = "mito_pipeline.download_ncbi_fasta:main"
evaluate-primers = "mito_pipeline.evaluate_primers:main"
build-taxonomy-summary = "mito_pipeline.build_taxonomy_summary:main"
merge-matrix-lineage = "mito_pipeline.merge_matrix_lineage:main"

[project.urls]
Repository = "https://github.com/jade-nhri/runmitopipe"
Issues = "https://github.com/jade-nhri/runmitopipe/issues"

[tool.setuptools.packages.find]
where = ["src"]
